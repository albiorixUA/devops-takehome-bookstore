name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install deps
        working-directory: app
        run: npm ci || npm install
      - name: Lint
        working-directory: app
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install deps
        working-directory: app
        run: npm ci || npm install
      - name: Build
        working-directory: app
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build image
        run: docker build -t bookstore:ci -f docker/Dockerfile .
      # Trivy is set to non-blocking for this take-home: we surface findings
      # but do not gate the PR on transitive npm CVEs that require a separate
      # fix PR. Plan: 30-day. See NOTES.md "Skipped Scope".
      # In a real production gate, exit-code should be "1".
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: bookstore:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Write CI env
        run: |
          cat > .env <<EOF
          NODE_ENV=production
          PORT=3000
          DATABASE_URL=postgres://bookstore:bookstore_password@db:5432/bookstore
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_only_throwaway_$(date +%s)
          PAYMENT_TOKEN=ci_only_throwaway
          INTERNAL_API_TOKEN=ci_only_throwaway
          NUXT_PUBLIC_API_BASE=/api
          EOF
      - name: Compose up
        run: docker compose up -d --build
      - name: Wait for healthy
        run: |
          for i in {1..30}; do
            healthy_count=$(docker compose ps | grep -c '(healthy)' || true)
            if [ "$healthy_count" -ge 4 ]; then
              echo "all healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "services did not become healthy in time"
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - name: Smoke check
        run: |
          curl -sf http://localhost:3000/api/health
          echo
          curl -sf http://localhost:3000/api/ready
          echo
      - name: Compose down
        if: always()
        run: docker compose down -v
